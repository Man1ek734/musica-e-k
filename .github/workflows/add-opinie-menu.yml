name: Add Opinie to navigation

on:
  push:
    paths:
      - '.github/workflows/add-opinie-menu.yml'

permissions:
  contents: write

jobs:
  update-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Opinie links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path('index.html'), Path('aktualnosci.html')]

          replacements = {
              'index.html': [
                  (
                      '       <li><a href="aktualnosci.html">Aktualności</a></li>\n       <li><a href="#kontakt">Kontakt</a></li>',
                      '       <li><a href="aktualnosci.html">Aktualności</a></li>\n       <li><a href="opinie.html">Opinie</a></li>\n       <li><a href="#kontakt">Kontakt</a></li>'
                  ),
                  (
                      '    <a href="aktualnosci.html">Aktualności</a>\n    <a href="#kontakt">Kontakt</a>',
                      '    <a href="aktualnosci.html">Aktualności</a>\n    <a href="opinie.html">Opinie</a>\n    <a href="#kontakt">Kontakt</a>'
                  ),
              ],
              'aktualnosci.html': [
                  (
                      '        <li><a class="active" href="aktualnosci.html">Aktualności</a></li>\n        <li><a href="index.html#kontakt">Kontakt</a></li>',
                      '        <li><a class="active" href="aktualnosci.html">Aktualności</a></li>\n        <li><a href="opinie.html">Opinie</a></li>\n        <li><a href="index.html#kontakt">Kontakt</a></li>'
                  ),
                  (
                      '    <a href="aktualnosci.html">Aktualności</a>\n    <a href="index.html#kontakt">Kontakt</a>',
                      '    <a href="aktualnosci.html">Aktualności</a>\n    <a href="opinie.html">Opinie</a>\n    <a href="index.html#kontakt">Kontakt</a>'
                  ),
              ],
          }

          changed = False
          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements[path.name]:
                  if old in text and 'opinie.html' not in old:
                      text = text.replace(old, new, 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed = True
                  print(f'Updated {path}')
              else:
                  print(f'No change needed in {path}')

          if not changed:
              print('Navigation was already up to date.')
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html aktualnosci.html
          git commit -m "Add Opinie link to navigation"
          git push
