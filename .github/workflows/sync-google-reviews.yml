name: Sync Google reviews

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch reviews from Google Places
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          key = os.environ.get('GOOGLE_MAPS_API_KEY', '').strip()
          if not key:
              print('Missing repository secret GOOGLE_MAPS_API_KEY')
              sys.exit(1)

          query = 'MUSICA Studium Muzyczne Ełk, Kardynała Stefana Wyszyńskiego 3, 19-300 Ełk, Poland'

          search_req = urllib.request.Request(
              'https://places.googleapis.com/v1/places:searchText',
              data=json.dumps({'textQuery': query, 'languageCode': 'pl'}).encode('utf-8'),
              headers={
                  'Content-Type': 'application/json',
                  'X-Goog-Api-Key': key,
                  'X-Goog-FieldMask': 'places.id,places.displayName,places.formattedAddress'
              },
              method='POST'
          )
          with urllib.request.urlopen(search_req, timeout=30) as resp:
              search_data = json.load(resp)

          places = search_data.get('places') or []
          if not places:
              raise RuntimeError('Google Places did not find MUSICA Studium Muzyczne Ełk')

          place_id = places[0]['id']
          details_req = urllib.request.Request(
              f'https://places.googleapis.com/v1/places/{place_id}?languageCode=pl',
              headers={
                  'X-Goog-Api-Key': key,
                  'X-Goog-FieldMask': 'displayName,rating,userRatingCount,reviews,googleMapsUri'
              }
          )
          with urllib.request.urlopen(details_req, timeout=30) as resp:
              place = json.load(resp)

          reviews = []
          for item in place.get('reviews') or []:
              author = item.get('authorAttribution') or {}
              text_obj = item.get('text') or item.get('originalText') or {}
              reviews.append({
                  'author': author.get('displayName') or 'Użytkownik Google',
                  'authorUrl': author.get('uri') or '',
                  'photoUrl': author.get('photoUri') or '',
                  'rating': item.get('rating'),
                  'text': text_obj.get('text') or '',
                  'relativeTime': item.get('relativePublishTimeDescription') or '',
                  'publishTime': item.get('publishTime') or ''
              })

          payload = {
              'placeId': place_id,
              'name': (place.get('displayName') or {}).get('text') or 'MUSICA Studium Muzyczne Ełk',
              'rating': place.get('rating'),
              'reviewCount': place.get('userRatingCount', 0),
              'googleMapsUrl': place.get('googleMapsUri') or '',
              'reviews': reviews,
              'updatedAt': datetime.now(timezone.utc).isoformat(),
              'source': 'Google Places API'
          }

          Path('reviews.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          print(f"Synced {len(reviews)} review(s), rating={payload['rating']}, count={payload['reviewCount']}")
          PY

      - name: Commit updated reviews
        shell: bash
        run: |
          if git diff --quiet -- reviews.json; then
            echo "No review changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews.json
          git commit -m "Sync Google reviews"
          git push
