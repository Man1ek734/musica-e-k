name: Aktualności z Facebooka

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: facebook-news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz najnowsze posty MUSICA
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python scripts/fetch_facebook.py

      - name: Zapisz aktualności w repozytorium
        run: |
          if git diff --quiet -- aktualnosci.json; then
            echo "Brak nowych postów."
            exit 0
          fi

          git config user.name "MUSICA Aktualności Bot"
          git config user.email "actions@users.noreply.github.com"

          git add aktualnosci.json
          git commit -m "Aktualizacja postów z Facebooka"
          git push
